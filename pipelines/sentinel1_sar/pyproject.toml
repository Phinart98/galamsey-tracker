[project]
name = "galamsey-sentinel1-sar"
version = "0.1.0"
description = "Monthly Sentinel-1 SAR backscatter-delta change detection over Ghana (Forkuor 2020 method) for the Galamsey Tracker"
requires-python = ">=3.12"
dependencies = [
    "pystac-client>=0.8.0",
    "planetary-computer>=1.0.0",
    "stackstac>=0.5.1",
    "xarray>=2024.10.0",
    "dask[distributed]>=2024.10.0",
    "rasterio>=1.4.0",
    "rio-cogeo>=5.4.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "numpy>=2.0.0",
    "boto3>=1.35.0",
    "psycopg[binary]>=3.2.0",
    "httpx>=0.27.0",
    "structlog>=24.0.0",
    "click>=8.0.0",
    "pystac>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-boto3>=1.35.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
