name: Ingest Sentinel-1 SAR

on:
  schedule:
    - cron: "0 3 1 * *"  # 1st of month, 03:00 UTC (1h after the weekly GFW cron's slot)
  workflow_dispatch:
    inputs:
      period:
        description: "Detection period YYYY-MM (default: previous calendar month)"
        required: false
        default: ""
      aoi:
        description: "AOI: ghana | wassa | atewa | birim | tano | pra"
        required: false
        default: "ghana"

jobs:
  ingest:
    name: Detect Sentinel-1 SAR change over Ghana
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
          enable-cache: true

      - name: System deps (GDAL is shipped via wheels; nothing else needed)
        run: |
          # Sentinel-1 RTC reads happen over HTTPS via rasterio's bundled GDAL;
          # no apt installs required. This step is a placeholder for future
          # native deps -- keeps the workflow editable without touching the
          # uv setup pattern.
          uname -a
          df -h
          free -m

      - name: Install pipeline dependencies
        run: uv sync --extra dev
        working-directory: pipelines/sentinel1_sar

      - name: Run detection
        env:
          DATABASE_URL:           ${{ secrets.DATABASE_URL }}
          R2_ACCOUNT_ID:          ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:       ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY:   ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET:              ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL:     ${{ secrets.R2_PUBLIC_BASE_URL }}
          # Inputs are read via env (NOT ${{ expr }}-interpolated into the
          # shell) so a malicious value like `ghana; curl evil` can't break
          # out. We also allowlist-validate before passing to Click.
          INPUT_AOI:              ${{ inputs.aoi }}
          INPUT_PERIOD:           ${{ inputs.period }}
        run: |
          set -euo pipefail
          AOI_ARG=""
          PERIOD_ARG=""
          if [ -n "${INPUT_AOI:-}" ]; then
            case "$INPUT_AOI" in
              ghana|wassa|atewa|birim|tano|pra)
                AOI_ARG="--aoi $INPUT_AOI"
                ;;
              *)
                echo "::error::aoi must be one of: ghana wassa atewa birim tano pra (got $INPUT_AOI)"
                exit 1
                ;;
            esac
          fi
          if [ -n "${INPUT_PERIOD:-}" ]; then
            if echo "$INPUT_PERIOD" | grep -Eq '^[0-9]{4}-(0[1-9]|1[0-2])$'; then
              PERIOD_ARG="--period $INPUT_PERIOD"
            else
              echo "::error::period must match YYYY-MM (got $INPUT_PERIOD)"
              exit 1
            fi
          fi
          uv run python -m detect $PERIOD_ARG $AOI_ARG
        working-directory: pipelines/sentinel1_sar
