name: Weekly update

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC, after the weekend's DIST-ALERT granules land
  workflow_dispatch:
    inputs:
      chips_limit:
        description: "Most places to image this run"
        default: "2000"
      signs_limit:
        description: "Most places to measure for open water this run (6000 clears a backlog)"
        default: "1500"
      signs_minutes:
        description: "Time limit in minutes for the open-water step"
        default: "45"
      trend_minutes:
        description: "Time limit in minutes for the trend step (switching on a new area recounts every month: give it 150)"
        default: "45"

concurrency:
  group: weekly-update
  cancel-in-progress: false

permissions:
  contents: write

# The pipeline's working files (place list with ids and readings, seeds, outlines, pictures) are kept between runs
# as one archive on a GitHub release. It is replaced each run, so it never grows the code history.
env:
  STATE_TAG: pipeline-state
  STATE_FILE: pipeline-state.tar.gz
  PREVIEW_PROJECT: galamsey-tracker
  # The pictures have their own Pages project, so neither site passes Pages' 20,000-file limit
  PICTURES_PROJECT: galamsey-tracker-pictures

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history, so the data commit can be rebased onto commits pushed during the run

      - name: Check secrets are set
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          for v in EARTHDATA_USERNAME EARTHDATA_PASSWORD CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then echo "::error::Missing secrets:$missing"; exit 1; fi

      # Fail in seconds, not after hours of work, if the publishing token is wrong or has expired
      - name: Check the Cloudflare token works
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for url in https://api.cloudflare.com/client/v4/user/tokens/verify                      "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify"; do
            status=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$url" | jq -r '.result.status // empty')
            [ "$status" = "active" ] && { echo "Cloudflare token is active"; exit 0; }
          done
          echo "::error::The Cloudflare token is not valid or not active"; exit 1

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync

      - name: Earthdata login for NASA OPERA files
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: |
          printf 'machine urs.earthdata.nasa.gov login %s password %s\n' "$EARTHDATA_USERNAME" "$EARTHDATA_PASSWORD" > ~/.netrc
          chmod 600 ~/.netrc

      - name: Restore the previous run's places, readings and pictures
        env:
          GH_TOKEN: ${{ github.token }}
        # A missing archive must stop the run: starting from nothing would hand every place a new reference
        run: |
          gh release download "$STATE_TAG" --pattern "$STATE_FILE" --dir "$RUNNER_TEMP"
          mkdir -p out && tar -xzf "$RUNNER_TEMP/$STATE_FILE" -C out

      - name: Weekly patches, licences, names and summary
        id: weekly
        timeout-minutes: 30
        run: uv run python -m tracker.run weekly

      - name: Before/after images for places without them
        timeout-minutes: 130
        # Missing pictures are retried next week, so a failure here must not stop the trend or the upload
        continue-on-error: true
        run: uv run python -m tracker.run chips --limit "${{ inputs.chips_limit || '2000' }}"

      - name: Open-water readings for places with no licence to mine
        timeout-minutes: ${{ fromJSON(inputs.signs_minutes || '45') }}
        # Largest first; places not reached are measured in later weeks, so a failure here must not stop the rest
        continue-on-error: true
        run: uv run python -m tracker.run signs --limit "${{ inputs.signs_limit || '1500' }}" --workers 4

      # The trend is written only when every month is done, so a timeout keeps last week's trend and must not
      # stop the site from being published
      - name: Monthly trend point
        timeout-minutes: ${{ fromJSON(inputs.trend_minutes || '45') }}
        continue-on-error: true
        run: uv run python -m tracker.run trend

      - name: Save places, readings and pictures for next run
        # Only when the restore worked, so a failed restore can never overwrite good state with nothing
        if: always() && steps.weekly.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The town and district cache saves downloading all of Ghana's map data every week
          tar -czf "$RUNNER_TEMP/$STATE_FILE" -C out places chips cache/places
          gh release upload "$STATE_TAG" "$RUNNER_TEMP/$STATE_FILE" --clobber

      # Always commit status.json, even after a failure: it keeps the repo active so GitHub
      # does not disable this schedule, and it lets the site say when an update is late.
      - name: Commit data
        if: always()
        working-directory: .
        run: |
          git config user.name "galamsey-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: weekly update $(date -u +%Y-%m-%d)"
          # Someone may have pushed while the run was going: put the data commit on top instead of failing
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/site/package-lock.json

      # Before the site, so every picture the new site links to is already there. If this fails, the site is not
      # rebuilt and last week's site stays up with last week's pictures.
      - name: Publish the pictures
        working-directory: apps/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:pictures -- "$PICTURES_PROJECT"

      # Until launch the site is a private preview: deploy-preview.mjs builds with PREVIEW=1 and adds noindex
      - name: Build and publish the site
        working-directory: apps/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CHIPS_BASE_URL: https://${{ env.PICTURES_PROJECT }}.pages.dev
        run: |
          npm ci
          npm run deploy:preview -- "$PREVIEW_PROJECT"
