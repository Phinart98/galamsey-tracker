[project]
name = "galamsey-tracker-pipeline"
version = "0.1.0"
description = "Weekly satellite pipeline for the Galamsey Tracker"
requires-python = ">=3.12"
dependencies = [
  "geopandas>=1.0",
  "numpy>=2.0",
  "pillow>=11.3",
  "pyproj>=3.6",
  "pystac-client>=0.8",
  "rasterio>=1.4",
  "requests>=2.32",
  "scipy>=1.13",
  "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tracker"]
